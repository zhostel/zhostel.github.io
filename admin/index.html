<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff · Z Hostel</title>
<link rel="icon" type="image/png" href="/assets/img/z-logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/z.css?v=20261015">
<style>
  .adm-top { display:flex; align-items:center; gap:14px; height:64px; border-bottom:1px solid var(--line); }
  .adm-top .who { margin-left:auto; font-size:14px; color:var(--muted); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:22px 0; }
  .tabs button { background:var(--surface); color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:9px 16px; font:700 14px var(--body); cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .tabs .count { opacity:.75; font-weight:600; margin-left:4px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .toolbar select, .toolbar input { width:auto; min-height:40px; padding:8px 12px; }
  .rows { display:grid; gap:10px; }
  .item { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:grid; gap:8px; }
  .item.new { border-left:3px solid var(--accent); }
  .item-h { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; }
  .item-h b { font-size:17px; }
  .item .msg { white-space:pre-wrap; color:var(--ink-2); font-size:15px; }
  .item .ctl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .item .ctl select, .item .ctl input { width:auto; min-height:36px; padding:6px 10px; font-size:14px; }
  .item .ctl input { flex:1; min-width:180px; }
  .sumgrid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .sum { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .sum h4 { margin-bottom:12px; }
  .hb { display:grid; grid-template-columns: minmax(110px, 40%) 1fr 40px; gap:8px; align-items:center; font-size:14px; margin:6px 0; }
  .hb .track { height:10px; background:var(--surface-3); border-radius:5px; overflow:hidden; }
  .hb .fill { height:100%; background:var(--accent); border-radius:5px; }
  .hb .n { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:700; }
  .kpis { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 170px), 1fr)); margin-bottom:22px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .kpi b { display:block; font:850 40px/1 var(--display); font-stretch:70%; }
  .kpi span { font-size:13px; color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); border:1px dashed var(--line-2); border-radius:12px; }
  table.data-table td { vertical-align:top; }
  .login { max-width:460px; margin:10vh auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="adm-top">
    <a class="brand" href="/"><img src="/assets/img/z-logo-180.png" alt="" width="36" height="36"><span>Z Staff</span></a>
    <span class="who" id="who"></span>
    <button class="btn sm ghost" id="logout" hidden>Log out</button>
  </div>

  <section id="login" class="login form-card" hidden>
    <span class="eyebrow">Staff only</span>
    <h1 style="font-size:44px">Sign in</h1>
    <p class="muted">Enter your staff email. We'll send a one-time sign-in link. No password needed.</p>
    <form class="form" id="login-form" novalidate>
      <div class="field"><label for="l-email">Staff email</label><input id="l-email" type="email" required autocomplete="email"></div>
      <button class="btn lg" type="submit">Email me a sign-in link</button>
      <p class="form-msg" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="inquiries">Inquiries <span class="count" id="c-inq"></span></button>
      <button role="tab" data-tab="partners">Sponsors <span class="count" id="c-par"></span></button>
      <button role="tab" data-tab="list">Z Street list <span class="count" id="c-list"></span></button>
      <button role="tab" data-tab="events">Event tools</button>
      <button role="tab" data-tab="staff">Staff</button>
    </div>
    <div id="panel"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js?v=20261015"></script>
<script src="/assets/js/admin.js?v=20261015"></script>
</body>
</html>
